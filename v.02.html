<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<title>ICE Survivor Demo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;

background:#111;

font-family:Arial;

}

canvas{

display:block;

background:#4a4a4a;

cursor:crosshair;

image-rendering:pixelated;

}

#hud{

position:absolute;

left:15px;

top:15px;

color:white;

font-size:20px;

text-shadow:2px 2px black;

}

</style>

</head>

<body>

<div id="hud">

❤️ <span id="hp">100</span>

<br>

⭐ <span id="level">1</span>

<br>

XP <span id="xp">0</span>/10

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

}

window.addEventListener("resize",resize);

resize();

const keys={};

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

});

document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});

const mouse={

x:0,

y:0,

down:false

};

canvas.addEventListener("mousemove",e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;

});

canvas.addEventListener("mousedown",()=>{

mouse.down=true;

});

canvas.addEventListener("mouseup",()=>{

mouse.down=false;

});

const player={

x:500,

y:300,

size:28,

speed:4,

hp:100,

level:1,

xp:0,

xpNeed:10,

angle:0

};

enemies.push({

    x:x,

    y:y,

    maxHp:hp,

    hp:hp,

    speed:speed,

    size:16,

    color:color,

    type:type

});

function updatePlayer(){

if(keys["w"])player.y-=player.speed;

if(keys["s"])player.y+=player.speed;

if(keys["a"])player.x-=player.speed;

if(keys["d"])player.x+=player.speed;

player.angle=Math.atan2(

mouse.y-player.y,

mouse.x-player.x

);

}

function drawEnemies(){

    enemies.forEach(enemy=>{

        // Gegner

        ctx.fillStyle=enemy.color;

        ctx.fillRect(

            enemy.x-enemy.size/2,

            enemy.y-enemy.size/2,

            enemy.size,

            enemy.size

        );

        // HP Balken Hintergrund

        ctx.fillStyle="#333";

        ctx.fillRect(

            enemy.x-12,

            enemy.y-18,

            24,

            4

        );

        // HP Balken

        ctx.fillStyle="#00ff00";

        ctx.fillRect(

            enemy.x-12,

            enemy.y-18,

            (enemy.hp/enemy.maxHp)*24,

            4

        );

    });

}

function drawPlayer(){

ctx.save();

ctx.translate(player.x,player.y);

ctx.rotate(player.angle);

ctx.fillStyle="#00ffff";

ctx.fillRect(-14,-14,28,28);

ctx.fillStyle="white";

ctx.fillRect(8,-2,16,4);

ctx.restore();

}

function drawMap(){

ctx.fillStyle="#606060";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

ctx.fillStyle="#2b4fa8";

for(let y=80;y<canvas.height;y+=120){

ctx.fillRect(50,y,80,40);

ctx.fillRect(canvas.width-130,y,80,40);

}

ctx.fillStyle="#c9c9c9";

ctx.fillRect(

canvas.width/2-60,

0,

120,

canvas.height

);

}

function updateHUD(){

document.getElementById("hp").innerText=Math.floor(player.hp);

document.getElementById("level").innerText=player.level;

document.getElementById("xp").innerText=player.xp;

}

function update(){

updatePlayer();

updateHUD();

}

function draw(){

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

drawMap();

drawPlayer();

}

function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>

</html>
